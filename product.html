        <div class="product-page-container">
            <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarLeft" aria-labelledby="sidebarLeftLabel">

                <div class="offcanvas-header">
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>

                <div class="offcanvas-body ">
                    <div class="cat-div p-4 ms-5 ">
                        <label for="categoryFilter" class="form-label fw-bold mt-3 mx-auto mb-0  fs-5 text-uppercase"
                            style="color: #380414;">Shop by Category</label>
                        <hr class=" mb-3 fw-bold  " style="color: #380414; height: 10px;">
                        <label class=" fw-bold mb-1">Gender : </label>

                        <select id="genderSelect" class="form-select custom-filter" onchange="updateFilters()">
                            <option value="all">All Genders</option>
                            <option value="women">Women</option>
                            <option value="men">Men</option>
                        </select>
                        <hr>

                        <label class=" fw-bold mb-1">Brand : </label>

                        <select id="brandSelect" class="form-select custom-filter" onchange="updateFilters()">
                            <option value="all">All Brands</option>
                            <option value="nike">Nike</option>
                            <option value="adidas">Adidas</option>
                            <option value="zara">Zara</option>
                        </select>
                        <hr>

                        <label class=" fw-bold mb-1">Type : </label>

                        <select id="typeSelect" class="form-select custom-filter" onchange="updateFilters()">
                            <option value="all">All Types</option>
                            <option value="t_shirts">T-Shirts</option>
                            <option value="pants">Pants</option>
                            <option value="dress">Dresses</option>
                            <option value="shirts">Shirts</option>
                        </select>
                        <hr>

                        <button class="search mx-auto my-3 btn w-100">APPLY FILTERS</button>

                    </div>
                </div>

            </div>

        </div>
