<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTE | Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg px-5 shadow-sm sticky-top w-100">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="logo2.png" class="logo" alt="Celeste Logo" style="height: 70px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarToggler">
                <ul class="navbar-nav mb-2 mb-lg-0 ms-auto gap-4">
                    <li class="nav-item"><a class="nav-link fs-5" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active fs-5" href="product.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link fs-5" href="about.html">About us</a></li>
                </ul>
                <button class="btn ms-lg-3 border-0 filtericon" style="box-shadow: none;background-color: black;"
                    type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarFilters">
                    <i class="bi bi-filter fs-3 "></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container-fluid my-5 ">
        <div class="d-flex justify-content-end mb-0">
            <div class="dropdown custom-sort-dropdown " id="ddown">
                <button class="btn dropdown-toggle d-flex justify-content-between align-items-center" type="button"
                    data-bs-toggle="dropdown">
                    <span id="currentBrandLabel">All Brands</span>
                    <i class="bi bi-chevron-down ms-4"></i>
                </button>

                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    <li><a class="dropdown-item" href="#" data-brand="" onclick="handleBrandFilter(this)">All Brands</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="#" data-brand="nike" onclick="handleBrandFilter(this)">Nike</a>
                    </li>
                    <li><a class="dropdown-item" href="#" data-brand="adidas"
                            onclick="handleBrandFilter(this)">Adidas</a></li>
                </ul>
            </div>
        </div>

        <div id="productsGrid" class="row g-4 row-cols-2 mt-0 row-cols-md-3 row-cols-lg-4">
        </div>
        <div class="showdetails" id="detail">

        </div>
    </main>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarFilters">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="sidebarFiltersLabel">CELESTE</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body p-0 d-flex flex-column">
            <div class="accordion accordion-flush" id="filterAccordion">

                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse"
                            data-bs-target="#menuWomen">
                            WOMEN
                        </button>
                    </h2>
                    <div id="menuWomen" class="accordion-collapse collapse" data-bs-parent="#filterAccordion">
                        <div class="accordion-body p-0">
                            <ul class="list-group list-group-flush ps-4">
                                <li class="list-group-item border-0 py-2">
                                    <a href="#" class="filter-link"
                                        onclick="filterProducts('women', 'TSHIRTS')">TSHIRTS</a>
                                </li>
                                <li class="list-group-item border-0 py-2">
                                    <a href="#" class="filter-link"
                                        onclick="filterProducts('women', 'COATS & CARDIGANS')">COATS & CARDIGANS</a>
                                </li>
                                <li class="list-group-item border-0 py-2">
                                    <a href="#" class="filter-link"
                                        onclick="filterProducts('women', 'SHIRTS')">SHIRTS</a>
                                </li>
                                <li class="list-group-item border-0 py-2">
                                    <a href="#" class="filter-link" onclick="filterProducts('women', 'PANTS')">PANTS</a>
                                </li>
                                <li class="list-group-item border-0 py-2">
                                    <a href="#" class="filter-link"
                                        onclick="filterProducts('women', 'DRESSES')">DRESSES</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse"
                            data-bs-target="#menuMen">
                            MEN
                        </button>
                    </h2>
                    <div id="menuMen" class="accordion-collapse collapse" data-bs-parent="#filterAccordion">
                        <div class="accordion-body p-0">
                            <ul class="list-group list-group-flush ps-4">
                                <li class="list-group-item border-0 py-2">
                                    <a href="#" class="filter-link"
                                        onclick="filterProducts('men', 'TSHIRTS')">TSHIRTS</a>
                                </li>
                                <li class="list-group-item border-0 py-2">
                                    <a href="#" class="filter-link" onclick="filterProducts('men', 'SHIRTS')">SHIRTS</a>
                                </li>
                                <li class="list-group-item border-0 py-2">
                                    <a href="#" class="filter-link" onclick="filterProducts('men', 'PANTS')">PANTS</a>
                                </li>
                                <li class="list-group-item border-0 py-2">
                                    <a href="#" class="filter-link"
                                        onclick="filterProducts('men', 'OUTERWEAR')">OUTERWEAR</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <a href="#" onclick="newArrival('Summer Of Us')"
                            class="accordion-button no-chevron collapsed fw-bold text-decoration-none">summer
                            collection</a>
                    </h2>
                </div>


                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <a href="#" class="accordion-button no-chevron collapsed fw-bold text-decoration-none"
                            onclick="renderAll()">All
                            products</a>
                    </h2>
                </div>

                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <a href="#" class="accordion-button no-chevron collapsed fw-bold text-decoration-none">ABOUT
                            US</a>
                    </h2>
                </div>

            </div>

            <div class="mt-auto p-4 border-top d-flex gap-4 justify-content-center bg-white">
                <a href="#" class="text-dark fs-5 social-icon"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-dark fs-5 social-icon"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-dark fs-5 social-icon"><i class="bi bi-tiktok"></i></a>
            </div>
        </div>
    </div>

    <footer class="bg-black text-white pt-5 pb-3">
        <div class="container text-center">
            <img src="logo2.png" class="logo mb-4" style="filter: invert(1);">
            <div class="d-flex justify-content-center gap-4 mb-4">
                <a href="#" class="text-white fs-4"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-white fs-4"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-white fs-4"><i class="bi bi-tiktok"></i></a>
            </div>
            <p class="text-muted small">&copy; 2026 CELESTE RETAIL. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
